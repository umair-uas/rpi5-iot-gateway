<text x="1094.0" y="353.0" font-size="9.5" fill="#DC2626" text-anchor="start">&#8594; ENOKEY</text>
<text x="48" y="591.0" font-size="12" fill="#6B7D9E">Accent traces the DX-M1-specific reality: a signed driver must load before anything reaches the NPU.</text>
<text x="48" y="606.0" font-size="12" fill="#6B7D9E">Dashed = general DEEPX vendor workflow, not verified on this host or in this repo. Today's running demo</text>
<text x="48" y="621.0" font-size="12" fill="#6B7D9E">instead ships a pre-compiled vendor sample (YoloV5S_PPU.dxnn, in dx-stream-sample). Not production- or</text>
<text x="48" y="636.0" font-size="12" fill="#6B7D9E">OTA-ready: see docs/DEEPX_DXM1.md.</text>
