name: release-hygiene

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "release-*" ]
  workflow_dispatch:

# This job only reads the tree — checkout, shellcheck, yamllint, greps.
# Without an explicit block the token inherits the repository default, which
# an admin can flip to read-write in one click, silently granting write to a
# workflow that runs on every push to main.
permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ensure release docs/scripts exist
        run: |
          test -f docs/RELEASE.md
          test -f scripts/release/release-build.sh
          test -f scripts/release/release-manifest.sh
          test -f cliff.toml
          test -f .github/workflows/release-notes.yml

      - name: Shell syntax checks
        run: |
          bash -n scripts/release/release-build.sh
          bash -n scripts/release/release-manifest.sh

      - name: shellcheck (all tracked scripts)
        run: |
          # scripts/hooks/* are extension-less by git-hook convention, so the
          # *.sh glob misses them — list them explicitly or they go unlinted.
          mapfile -t scripts < <(git ls-files 'scripts/*.sh' 'scripts/hooks/*')
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "no tracked scripts/*.sh found"
            exit 0
          fi
          shellcheck -S warning "${scripts[@]}"

      - name: nftables rules name an address family
        run: |
          # In a "table inet", a rule naming a port with no family match admits
          # it on IPv4 AND IPv6 alike. That is how SSH became reachable over a
          # global IPv6 address: the ruleset family-qualified ICMP but not the
          # service ports, and nothing checked.
          #
          # This lint only works because the OTBR rules live in their own .conf
          # file. They were previously embedded as text inside a sed script in
          # iotgw-firewall.bb, invisible to any grep over *.conf — so a check
          # like this would have passed while the branch that actually shipped
          # carried unqualified rules.
          mapfile -t rulesets < <(git ls-files '*/nftables*.conf')
          if [[ ${#rulesets[@]} -eq 0 ]]; then
            echo "no tracked nftables rulesets found"
            exit 0
          fi
          # Matches tcp/udp dport ANYWHERE on a rule line (not just as the
          # first token, so "ct state new tcp dport 22 accept" is caught
          # too). Comments are stripped before matching, both whole-line and
          # trailing, so a rule cannot evade on the strength of its own
          # comment, and a rule already constrained by "meta nfproto", "ip",
          # or "ip6" is accepted.
          rc=0
          for f in "${rulesets[@]}"; do
            bad=$(sed -E 's/#.*$//' "$f" \
              | grep -nE '\b(tcp|udp)[[:space:]]+dport\b' \
              | grep -vE '\bmeta[[:space:]]+nfproto\b|\bip6?\b') || true
            if [[ -n "$bad" ]]; then
              echo "$bad"
              echo "::error file=$f::port rule with no address family (add 'meta nfproto ipv4'/'ipv6')"
              rc=1
            fi
          done
          exit $rc

      - name: Install yamllint
        run: pip install --quiet yamllint==1.35.1

      - name: yamllint (kas configs and workflows)
        run: |
          mapfile -t yamls < <(git ls-files 'kas/*.yml' '.github/workflows/*.yml')
          if [[ ${#yamls[@]} -eq 0 ]]; then
            echo "no tracked kas or workflow yaml found"
            exit 0
          fi
          yamllint "${yamls[@]}"

      - name: Historical changelog sanity
        run: |
          grep -nE '^\[Unreleased\]:' CHANGELOG.md
          grep -nE '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md

      - name: Version variable sanity
        run: |
          grep -nE 'IOTGW_VERSION_MAJOR \?= "[0-9]+"' meta-iot-gateway/conf/distro/include/iotgw-common.inc
          grep -nE 'IOTGW_VERSION_MINOR \?= "[0-9]+"' meta-iot-gateway/conf/distro/include/iotgw-common.inc
          grep -nE 'IOTGW_VERSION_PATCH \?= "[0-9]+"' meta-iot-gateway/conf/distro/include/iotgw-common.inc
