# Keep the DX-M1 driver's required symbols exported under
# CONFIG_TRIM_UNUSED_KSYMS=y. Path is resolved relative to the kernel source
# tree; the file is staged into ${S} by the kernel bbappend's
# do_configure:prepend, which hard-fails if it is missing — a
# CONFIG_UNUSED_KSYMS_WHITELIST pointing at a nonexistent path is silently
# ignored by Kbuild, not an error, so absence must be caught explicitly.
CONFIG_UNUSED_KSYMS_WHITELIST="deepx-dxm1-ksyms.txt"
