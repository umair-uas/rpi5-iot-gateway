# Persistent operator-held kernel module-signing key.
#
# Applied ONLY when IOTGW_MODULE_SIG_KEY_FILE is set (see
# classes/iotgw-kernel-module-sig-key.bbclass). Without it the kernel keeps
# CONFIG_MODULE_SIG_KEY at its default "certs/signing_key.pem", which Kbuild
# AUTO-GENERATES on every build whose ${B}/certs is empty -- so a module built
# against build N cannot load on build N+1's kernel under
# CONFIG_MODULE_SIG_FORCE=y. That is what blocks rootfs-only OTA.
#
# The value is deliberately a path RELATIVE to the kernel objtree, not an
# absolute one. CONFIG_MODULE_SIG_KEY is compiled into the kernel .config, and
# CONFIG_IKCONFIG (ikconfig.cfg) publishes that .config as /proc/config.gz on
# the target -- an absolute path would ship the build host's home directory to
# every device.
#
# The name must also differ from "certs/signing_key.pem": certs/Makefile gates
# its auto-generation rule on
#     ifeq ($(CONFIG_MODULE_SIG_KEY),certs/signing_key.pem)
# so keeping the default name would leave a `$(call if_changed,gen_key)` rule
# that can overwrite a pre-placed key. Any other name disables that rule
# entirely and the file is simply consumed.
CONFIG_MODULE_SIG_KEY="certs/iotgw-module-signing-key.pem"
