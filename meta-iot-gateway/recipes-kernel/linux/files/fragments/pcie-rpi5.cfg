# BCM2712 PCIe host bridge: built in, not modular.
#
# The mainline arm64 defconfig ships CONFIG_PCIE_BRCMSTB=m, which is correct
# reasoning for a generic distro kernel (ship one image, load what you find)
# and wrong for a fixed appliance whose PCIe bridge is soldered into the SoC.
#
# As a module it does not load until udev gets to it, which on this board was
# ~4.7s into boot — after systemd-modules-load had already run. Anything that
# expects a PCI bus before then races it. Measured 2026-09-01 with the DX-M1:
#
#   [3.116199] dx_dma: loading out-of-tree module          <- driver
#   [3.161570] dxrt_driver_cdev_init: 0 devices            <- no bus yet
#   [4.701316] brcm-pcie 1000110000.pcie: host bridge ...  <- bus appears
#
# Building it in makes the bus exist before userspace runs at all, which
# removes that class of race by construction for EVERY PCIe device rather than
# one driver at a time.
#
# This is defence in depth, NOT a replacement for the two DX-M1 fixes that
# already landed: dropping the forced KERNEL_MODULE_AUTOLOAD (so udev autoloads
# by PCI modalias at enumeration time) and pcie_aspm=off. Both stay. Relying on
# a forced early load "working because the bus happens to be up sooner" would
# be exactly the kind of luck this fragment exists to eliminate.
#
# Deliberately NOT gated on any feature: board-level correctness, not an
# accelerator option. Also forward-looking — if root ever moves to NVMe on this
# gateway, a modular host bridge stops being a race and becomes a boot failure.
CONFIG_PCIE_BRCMSTB=y
