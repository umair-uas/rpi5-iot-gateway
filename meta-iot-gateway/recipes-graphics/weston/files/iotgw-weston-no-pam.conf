# Run the compositor without a PAM login session.
#
# Upstream weston.service uses PAMName=weston-autologin, which opens a PAM
# session for the `weston` service account. That fails on this distro:
#
#   PAM failed: Authentication token is no longer valid; new one required
#   weston.service: Failed at step PAM spawning /usr/bin/weston
#   Main process exited, code=exited, status=224/PAM
#
# Two of our own policies combine to guarantee it. shadow_%.bbappend hardens
# /etc/login.defs with PASS_MAX_DAYS 90, so every account created by useradd
# during rootfs assembly inherits a 90-day maximum age -- service accounts
# included. Reproducible builds then pin the account's last-change field to a
# fixed epoch (15069 = 2011-04-05), so the account is born already expired:
#
#   weston:!:15069:7:90:14:::        -> "Password expires: Jul 04, 2011"
#
# The account is locked (`!`) and has no password at all, so nothing can ever
# "renew" it; PAM refuses the session on every boot, forever. Note a UID-based
# exemption would not have helped -- weston gets UID 1000.
#
# The fix is to stop asking for a login session the compositor never needed: a
# system service is not an interactive login. PAMName= (empty) drops it. Since
# pam_systemd was also what provided XDG_RUNTIME_DIR, RuntimeDirectory= replaces
# it with a systemd-managed /run/weston owned by the service user.
#
# Deliberately NOT fixed by relaxing password aging: that is a real hardening
# control (AUTH-9286) and it applies correctly to the interactive accounts it
# was written for. Verified on target that this drop-in alone starts the
# compositor with the shadow entry left expired, so no security policy is
# weakened to get a display.
[Service]
PAMName=
RuntimeDirectory=weston
Environment=XDG_RUNTIME_DIR=/run/weston
