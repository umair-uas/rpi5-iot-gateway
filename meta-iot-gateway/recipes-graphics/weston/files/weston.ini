# Weston configuration for the IoT Gateway desktop/lab image.
#
# This OVERRIDES oe-core's weston-init/weston.ini by FILESEXTRAPATHS search
# order — it is not a second copy. An earlier version of this file was attached
# to the `weston` recipe instead, which made both `weston` and `weston-init`
# own /etc/xdg/weston/weston.ini and failed do_rootfs with a hard RPM conflict:
#
#   file /etc/xdg/weston/weston.ini conflicts between attempted installs of
#   weston-init-1.0-r0.raspberrypi5 and weston-15.0.0-r0.cortexa76
#
# Layer priority does not resolve that — it decides which RECIPE provides a
# file, not which PACKAGE may own a path at install time.
#
# Keep oe-core's headless-tolerance defaults; they are not decoration:
#   require-input=false   boot with no keyboard attached
#   require-outputs=none  boot with HDMI unplugged (the compositor still starts)
#   repaint-window=10     upstream default
[core]
require-input=false
repaint-window=10
require-outputs=none
# Belt-and-braces only — this line is NOT what keeps X11 out, and on its own it
# did nothing at all. weston-init.bb:70 inserts `xwayland=true` directly after
# the [core] header (sed `a`), i.e. ABOVE this line, and Weston's parser takes
# the FIRST match for a duplicated key. The real control is
# PACKAGECONFIG:remove:pn-weston-init = "xwayland" in iotgw-common.inc, which
# stops weston-init from deriving the xwayland PACKAGECONFIG and running that
# sed in the first place. Kept here to state intent, not to enforce it.
xwayland=false

# Never blank the screen. This is a bench machine running continuous camera ->
# inference -> display pipelines, and Weston's idle timer is reset by INPUT
# EVENTS ONLY — a client rendering video does not hold the output awake. At the
# 300s default the panel DPMS-off's mid-demo while the pipeline happily keeps
# running, which reads as "the demo died" and is not that at all.
#
# This MUST live in [core]. Weston has no [idle] section; an earlier version of
# this file put idle-time there and it was silently ignored, so the default
# timeout stayed in force and the screen blanked anyway. oe-core's own
# weston-init.bb:74 confirms the placement:
#     sed -i -e "/^\[core\]/a idle-time=0" .../weston.ini
# Same failure shape as the xwayland line below: reads correctly, does nothing.
idle-time=0

[shell]
panel-position=top
locking=false
num-workspaces=4

[keyboard]
keymap_layout=us
